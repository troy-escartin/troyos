name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet restore
          else
            echo 'No .NET solution or project found; skipping restore.'
          fi

      - name: Build
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet build --configuration Release --no-restore
          else
            echo 'No .NET solution or project found; skipping build.'
          fi

      - name: Test
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet test --configuration Release --no-build --no-restore
          else
            echo 'No .NET solution or project found; skipping tests.'
          fi
