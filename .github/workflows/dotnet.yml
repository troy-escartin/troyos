name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Restore dependencies
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet restore
          else
            echo 'No .NET solution or project found; skipping restore.'
          fi

      - name: Build
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet build --configuration Release --no-restore
          else
            echo 'No .NET solution or project found; skipping build.'
          fi

      - name: Test
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet test --configuration Release --no-build --no-restore
          else
            echo 'No .NET solution or project found; skipping tests.'
          fi

      - name: Publish Blazor WebAssembly client
        if: github.event_name == 'push'
        run: dotnet publish TroyOS.UI/TroyOS.UI.Client/TroyOS.UI.Client.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy ./publish/wwwroot --project-name=troyos
