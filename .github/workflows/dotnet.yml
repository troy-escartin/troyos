name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Restore dependencies
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet restore
          else
            echo 'No .NET solution or project found; skipping restore.'
          fi

      - name: Build
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet build --configuration Release --no-restore
          else
            echo 'No .NET solution or project found; skipping build.'
          fi

      - name: Test
        shell: bash
        run: |
          if find . -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' \) | grep -q .; then
            dotnet test --configuration Release --no-build --no-restore
          else
            echo 'No .NET solution or project found; skipping tests.'
          fi

      - name: Publish Blazor WebAssembly client
        if: github.event_name == 'push'
        env:
          TROYOS_API_BASE_URL: ${{ secrets.TROYOS_API_BASE_URL }}
        run: dotnet publish TroyOS.UI/TroyOS.UI.Client/TroyOS.UI.Client.csproj --configuration Release --no-restore --output ./publish

      - name: Configure production API URL
        if: github.event_name == 'push'
        shell: bash
        env:
          TROYOS_API_BASE_URL: ${{ secrets.TROYOS_API_BASE_URL }}
        run: |
          if [ -z "$TROYOS_API_BASE_URL" ]; then
            echo "TROYOS_API_BASE_URL must be configured as a repository secret."
            exit 1
          fi
          python -c "import json, os, pathlib; path = pathlib.Path('publish/wwwroot/appsettings.json'); data = json.loads(path.read_text()); data['ApiBaseUrl'] = os.environ['TROYOS_API_BASE_URL'].rstrip('/') + '/'; path.write_text(json.dumps(data, indent=2) + '\\n')"

      - name: Publish Minimal API
        if: github.event_name == 'push'
        run: dotnet publish TroyOS.Api/TroyOS.Api.csproj --configuration Release --no-restore --output ./publish-api

      - name: Upload Minimal API deployment package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: troyos-api-publish
          path: ./publish-api

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy ./publish/wwwroot --project-name=troyos
